name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs twice (tests, then coverage). The AppTests that run real scans
    # (One-Click multi-trait, the single-trait view, Post-GWAS, the phenotype
    # transformation Apply flow and the haplotype assignments) add several minutes to
    # each pass; one pass took about 23 minutes locally.
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install pytest pytest-cov

      - name: Lint with ruff
        run: pip install ruff && ruff check .

      - name: Run tests
        # The slow tests (full CLI runs in both genotype-table modes) run in their own job below.
        run: pytest tests/ -v --tb=short -m "not slow"

      - name: Packaged-data guard (build, install, resolve)
        # The gene models must still be reachable from an INSTALL, not just from
        # a source checkout. A "are the files in the wheel" check is not enough:
        # ship data/ under a name the resolver never looks at and that check goes
        # green with the bug intact. So build the wheel, install it somewhere
        # else, and ask the resolver itself -- from a directory outside the
        # checkout, so an accidental source-tree import cannot mask a failure.
        run: |
          pip install build
          python -m build --wheel
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-install" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/wheel-install" python "$GITHUB_WORKSPACE/scripts/check_packaged_data.py"

      - name: End-to-end null calibration
        # Runs LOCO MLM on a simulated null phenotype and asserts
        # lambda_GC in [0.85, 1.15] with zero genome-wide hits.
        # Catches calibration regressions that ordinary unit tests miss.
        run: pytest tests/test_null_calibration.py -v --tb=short

      - name: Coverage report
        # Gate at 50% as a regression floor; current total is 76% (gwas + utils) and
        # novelty-module coverage (haplotype, ld, plotting) is a v1.1
        # target. The report is printed on every run so reviewers can
        # read the per-module breakdown.
        run: pytest tests/ -m "not slow" --cov=gwas --cov=utils --cov-report=term-missing --cov-fail-under=50

  slow:
    # The genotype table kept in memory and on disk give byte-identical results
    # (tests/test_slow_store_equivalence.py): the scaling audit's cases whose inputs are in the
    # repository, in both modes, read in pieces of 1, 64 and 997 SNPs, the FarmCPU last-chunk
    # cases and parallel subsampling. Results are byte-identical only at a fixed thread count,
    # so every run is pinned to one BLAS thread. Once, on one Python version.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      TRACE_SLOW_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install pytest

      - name: Memory and disk give the same results
        run: pytest tests/ -m slow -v --tb=short -rs
